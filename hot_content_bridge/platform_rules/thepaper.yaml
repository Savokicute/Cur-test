# =============================================================
# 澎湃新闻 (thepaper.cn) 内容提取规则
# =============================================================
# 平台标识，必须与 trendRadar/config/config.yaml 中的 platforms.sources[].id 一致
platform_id: thepaper

# 显示名称，用于日志和界面展示
display_name: 澎湃新闻

# 是否启用该规则
enabled: true

# =============================================================
# 域名匹配配置
# =============================================================
# 用于无 platform_id 时的兜底匹配，填写该平台文章落地页的实际域名
hosts:
  - thepaper.cn
  - m.thepaper.cn

# =============================================================
# 爬虫阶段配置 (crawl4ai)
# =============================================================
crawl:
  primary_target: ".index_cententWrap"
  css_selector: ".index_cententWrap"
  content_filter: none
  prefer_raw_markdown: true
  use_target_elements: true
  delay_before_return_html: 1.0
  wait_until: load

  # 【关键】额外排除的元素选择器 - 仅排除最明显的干扰
  # 说明：只排除header,footer,nav,aside，其他让crawl4ai自己判断
  excluded_selector_extra: >-
    header,[class*='Header'],[class*='header'],
    footer,[class*='Footer'],[class*='footer'],
    [class*='nav'],[class*='Nav'],[id*='nav'],
    [class*='toolbar'],[class*='channel'],[class*='Channel'],
    [class*='copyright'],[class*='Copyright'],
    [class*='wuzhangai'],[class*='feedback'],[class*='Feedback'],
    [class*='related'],[class*='recommend'],[class*='hotnews']

markdown_post:
  # 是否规范化 Markdown 格式（标题、段落、列表、图片等）
  normalize_markdown: true

  # 是否在文首添加热榜摘要信息
  prepend_hot_summary: true

  # 【关键】导航标签列表
  # 说明：行内容匹配这些词时会被当作导航项删除（纯文本或带项目符号）
  nav_labels:
    - 要闻
    - 深度
    - 直播
    - 视频
    - 时事
    - 更多
    - 问吧
    - 澎湃
    - 首页
    - 关注
    - 订阅
    - 收藏
    - 互动
    - 答题
    - 游戏
    - 活动
    - 推广
    - 下载
    - APP
    - 客户端
    - 二维码
    - 早晚报
    - 澎湃矩阵
    - 法律声明
    - 广告合作
    - 联系我们
    - 关于我们
    - 反馈

  # 【关键】行删除模式列表
  # 说明：行内容包含这些字符串时会被删除（正则 OR 匹配）
  drop_line_patterns:
    - "互联网新闻信息服务许可证"
    - "增值电信业务"
