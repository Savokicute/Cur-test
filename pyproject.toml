[project]
name = "hot-content-bridge"
version = "0.1.0"
description = "Hot-list ingestion (trendRadar) + article body crawl (crawl4ai)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "trendradar",
    "crawl4ai",
    "PyYAML>=6.0.3",
    "click>=8.1.7",
    "tenacity>=8.5.0",
    "markdown>=3.5",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "cachetools>=5.3.0",
    "aioredis>=2.0.0",
    "jinja2>=3.1.0",
    "apscheduler>=3.10.0",
    "python-multipart>=0.0.6",
    "bcrypt>=4.2.0",
]

[project.scripts]
hot-content-bridge = "hot_content_bridge.cli:main"
hotspot-api = "app.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hot_content_bridge"]

[tool.uv.sources]
trendradar = { path = "trendRadar", editable = true }
crawl4ai = { path = "crawl4ai", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["hot_content_bridge/tests"]
